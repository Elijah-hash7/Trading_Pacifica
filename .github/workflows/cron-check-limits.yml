name: Check Limit Orders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-limits endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL || vars.CRON_URL || 'https://trading-pacificast.vercel.app/api/cron/check-limits' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET. Add it in GitHub repo settings (Actions → Secrets and variables)."
            exit 1
          fi
          echo "Pinging: $CRON_URL"
          curl --fail-with-body -sS -X GET "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: github-actions-cron"
